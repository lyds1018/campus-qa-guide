[project]
name = "campus-qa-guide"
version = "0.1.0"
description = "校园智能问答与办事指南系统"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "django>=5.2,<5.3",
  "django-ninja>=1.3,<1.4",
  "uvicorn[standard]>=0.32,<0.33",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<0.28",
  "tenacity>=9.0,<10",
  "psycopg[binary,pool]>=3.2,<3.3",
  "pgvector>=0.3,<0.4",
  "django-redis>=5.4,<6",
  "django-cors-headers>=4.6,<5",
  "pymupdf>=1.24,<1.25",
  "jieba>=0.42,<0.43",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-django>=4.9,<5",
  "respx>=0.21,<0.22",
  "ruff>=0.7,<0.8",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
